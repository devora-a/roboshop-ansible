- names: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    imageid: ami-0220d79f3f480ecf5
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instances:
      instances_type: t3.micro
      name: "roboshop-{{ iteam }}"
      image id: "{{ image id }}"
      security groups:
      - "roboshop-{{ item }}"
      - roboshop-common
    loop: "{{ instances }}"
    register: ec2_output

  - name: print output
    debug:
      msg: "{{ ec2_output }}"
          