- name: roboshop instances management
  hosts: localhost
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "frontend"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: arrud.online
    action: create
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      security_groups:
      - "roboshop-{{ item }}"
      - roboshop-common
    loop: "{{ instances }}"
    register: ec2_output
    # when: action == "create"

  - name: print output
    debug:
      msg: "{{ ec2_output }}"